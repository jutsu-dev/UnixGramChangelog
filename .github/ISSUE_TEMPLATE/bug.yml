name: Ошибка
description: Сообщить о воспроизводимой проблеме
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Что произошло
      description: Кратко опишите наблюдаемое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. Запустить...
        2. Отправить...
        3. Увидеть...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или commit
  - type: textarea
    id: logs
    attributes:
      label: Логи без секретов
      render: shell
