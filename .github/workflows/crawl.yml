name: UnixGram crawler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unixgram-web-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Update snapshots
        run: python scripts/crawl_web_snapshots.py
      - name: Commit detected changes
        run: |
          git config user.name "unixgram-changelog[bot]"
          git config user.email "unixgram-changelog[bot]@users.noreply.github.com"
          changed=0
          if ! git diff --quiet -- data/snapshots/unixgram; then
            git add data/snapshots/unixgram
            git commit -m "[snapshot][unixgram] Update web resources"
            changed=1
          fi
          if ! git diff --quiet -- data/snapshots/unixplace; then
            git add data/snapshots/unixplace
            git commit -m "[snapshot][unixplace] Update marketplace resources"
            changed=1
          fi
          if [ "$changed" -eq 1 ]; then
            git push
          else
            echo "No changes"
          fi
