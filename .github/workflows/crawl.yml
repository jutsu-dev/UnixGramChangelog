name: UnixGram crawler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unixgram-web-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Update snapshots
        run: python scripts/crawl_web_snapshots.py
      - name: Commit detected changes
        run: |
          if git diff --quiet -- data/snapshots; then
            echo "No changes"
            exit 0
          fi
          git config user.name "unixgram-changelog[bot]"
          git config user.email "unixgram-changelog[bot]@users.noreply.github.com"
          git add data/snapshots
          git commit -m "[snapshot] Update UnixGram web resources"
          git push
