name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[snapshot]') &&
      !contains(github.event.head_commit.message, '[unixgram]') &&
      !contains(github.event.head_commit.message, '[unixplace]')
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: unixgram-changelog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Trust the VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Upload release archive
        env:
          RELEASE_ID: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          archive="$RUNNER_TEMP/unixgram-changelog-release.tgz"
          tar --exclude='.git' --exclude='.venv' --exclude='dist' -czf "$archive" .
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/unixgram-changelog/releases/$RELEASE_ID"
          scp -P "$VPS_PORT" "$archive" "$VPS_USER@$VPS_HOST:/opt/unixgram-changelog/releases/$RELEASE_ID/release.tgz"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd /opt/unixgram-changelog/releases/$RELEASE_ID && tar -xzf release.tgz && rm -f release.tgz && chmod +x deploy/deploy.sh && ./deploy/deploy.sh $RELEASE_ID"
