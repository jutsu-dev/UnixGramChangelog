name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Trust the VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Upload release archive
        env:
          RELEASE_ID: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          archive="$RUNNER_TEMP/unixgram-changelog-release.tgz"
          tar --exclude='.git' --exclude='.venv' --exclude='dist' -czf "$archive" .
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/unixgram-changelog/releases/$RELEASE_ID"
          scp -P "$VPS_PORT" "$archive" "$VPS_USER@$VPS_HOST:/opt/unixgram-changelog/releases/$RELEASE_ID/release.tgz"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd /opt/unixgram-changelog/releases/$RELEASE_ID && tar -xzf release.tgz && rm -f release.tgz && chmod +x deploy/deploy.sh && ./deploy/deploy.sh $RELEASE_ID"
